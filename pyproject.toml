[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentfence"
version = "0.1.0"
description = "Offline-first policy testing and audit summaries for AI agent tool calls"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "PremLabs Security Lab"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.scripts]
agentfence = "cli:main"

[tool.setuptools]
py-modules = ["agentfence", "cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
